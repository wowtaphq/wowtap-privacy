<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>와우탭 앱 다운로드</title>
    <script>
        // 접속 기기를 판별해 해당 스토어로 즉시 이동한다.
        // head에 두어 화면이 그려지기 전에 이동시킨다 (깜빡임 방지).
        // ⚠️ QR 스캐너 앱의 내장 브라우저는 User-Agent가 제각각이라 판별이 빗나갈 수 있다.
        //    그래서 본문에 수동 버튼 2개를 항상 표시한다 — 이 스크립트가 실패해도 다운로드가 가능해야 한다.
        (function () {
            // 스토어 주소는 이 두 상수가 단일 출처다. 본문 버튼도 아래에서 같은 값을 채운다.
            var APPSTORE = 'https://apps.apple.com/app/id6795469163?ct=package_qr';
            var PLAY = 'https://play.google.com/store/apps/details?id=com.wowtap.app&referrer=utm_source%3Dpackage_qr%26utm_medium%3Dprint';

            var ua = navigator.userAgent || '';
            // iPadOS 13+ 는 UA가 Macintosh로 잡히므로 터치 지원 여부로 함께 판별한다.
            var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            var isAndroid = /Android/.test(ua);

            // replace를 쓰면 뒤로가기 시 이 페이지로 되돌아오지 않는다.
            if (isIOS) {
                location.replace(APPSTORE);
            } else if (isAndroid) {
                location.replace(PLAY);
            }
            // 그 외(PC 등)는 이동하지 않고 아래 선택 화면을 그대로 보여준다.
        })();
    </script>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 48px 20px 64px;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
            line-height: 1.7;
            color: #222;
            background: #fff;
            -webkit-text-size-adjust: 100%;
        }
        .wrap { max-width: 420px; margin: 0 auto; text-align: center; }
        .brand {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #2680EB;
            margin-bottom: 28px;
        }
        h1 { font-size: 1.25rem; margin: 0 0 8px; }
        .lead { color: #555; margin: 0 0 32px; font-size: 0.95rem; }
        .lead .en { color: #999; font-size: 0.85rem; }
        .btn {
            display: block;
            padding: 15px 20px;
            margin: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border: 1.5px solid #2680EB;
            color: #2680EB;
            background: #fff;
        }
        .btn.primary { background: #2680EB; color: #fff; }
        .hint { color: #888; font-size: 0.85rem; margin-top: 24px; }
        footer { margin-top: 44px; color: #aaa; font-size: 0.8rem; }
        footer a { color: #888; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="brand">wowtap!</div>

    <h1>앱 다운로드</h1>
    <p class="lead">
        사용 중인 기기의 스토어로 이동합니다.<br>
        <span class="en">Get the app for your device</span>
    </p>

    <!-- 자동 이동이 실패해도 다운로드가 가능하도록 두 스토어를 항상 노출한다 -->
    <a class="btn primary" href="https://apps.apple.com/app/id6795469163?ct=package_qr">App Store &middot; iPhone / iPad</a>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.wowtap.app&amp;referrer=utm_source%3Dpackage_qr%26utm_medium%3Dprint">Google Play &middot; Android</a>

    <p class="hint">자동으로 이동하지 않으면 위 버튼을 눌러주세요.</p>

    <footer>
        와우탭(WowTap)<br>
        <a href="./index.html">개인정보 처리방침</a> &middot;
        <a href="./support.html">고객지원</a>
    </footer>
</div>
</body>
</html>
