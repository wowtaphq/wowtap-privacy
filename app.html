<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>와우탭 앱 다운로드</title>
    <script>
        // 제품 패키지 QR의 착지 페이지. 접속 기기를 판별해 해당 스토어로 보낸다.
        //
        // ⚠️ QR 스캐너 앱의 내장 브라우저는 User-Agent가 제각각이라 판별이 빗나갈 수 있다.
        //    그래서 본문에 수동 버튼 2개를 항상 표시한다 — 이 스크립트가 실패해도 다운로드가 가능해야 한다.
        (function () {
            // ── 스토어 주소 — 이 두 값이 단일 출처다 (본문 버튼 href도 아래에서 이 값으로 덮어쓴다) ──

            // 🔴 Apple 캠페인 링크는 pt·ct·mt 3개가 모두 있어야 App Store Connect 앱 분석에 집계된다.
            //    pt(Provider ID)가 비어 있으면 링크는 정상 동작하지만 캠페인 집계는 되지 않는다.
            //    pt는 따로 찾는 값이 아니라 캠페인을 만들면 자동 발급된다:
            //    App Store Connect → 앱 선택 → Analytics → 획득 > 캠페인 → [+] → 캠페인 이름 입력
            //    → pt·ct가 들어간 링크가 생성된다. 그 pt 값(숫자)을 아래에 넣는다.
            //    ⚠️ 캠페인은 "최초 다운로드 5건 + 24시간" 을 넘겨야 대시보드에 나타난다.
            //    아래 3개 값은 App Store Connect가 생성한 캠페인 링크에서 그대로 가져온 것이다 (2026-08-12).
            var APPLE_PT = '129186162';               // Provider ID
            var APPLE_CT = 'package_qr';              // 캠페인 토큰 (최대 30자) — 캠페인 이름과 일치해야 한다

            // 경로가 /app/apple-store/id... 인 것은 Apple이 생성한 형식을 그대로 따른 것이다.
            var APPSTORE = 'https://apps.apple.com/app/apple-store/id6795469163'
                         + '?pt=' + APPLE_PT + '&ct=' + APPLE_CT + '&mt=8';

            // ── 스캔 고유 토큰(scan_id) ──
            // 이 스캔과 그 뒤의 앱 설치를 잇기 위한 1회용 난수. 개인을 식별하는 값이 아니라
            // "같은 스캔에서 온 설치인가"만 판별한다.
            // ⚠️ Android 전용 — Play Install Referrer로만 앱에 전달된다.
            //    iOS(App Store)는 애플이 설계상 개인 단위 전달 경로를 제공하지 않아 대상이 아니다.
            var SCAN_KEY = 'wowtap_scan_id';
            function newScanId() {
                try {
                    var a = new Uint8Array(8);
                    (window.crypto || window.msCrypto).getRandomValues(a);
                    return Array.prototype.map.call(a, function (b) {
                        return ('0' + b.toString(16)).slice(-2);
                    }).join('');
                } catch (e) {
                    return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
                }
            }
            // 같은 탭에서 재로드되면 같은 토큰을 쓴다(중복 발급 방지). 새 QR 스캔은 새 탭 = 새 토큰.
            var scanId;
            try {
                scanId = sessionStorage.getItem(SCAN_KEY);
                if (!scanId) { scanId = newScanId(); sessionStorage.setItem(SCAN_KEY, scanId); }
            } catch (e) { scanId = newScanId(); }

            // Play는 referrer 안에 UTM을 실어 보낸다. utm_campaign은 인쇄 차수 구분용
            // (2차 인쇄분이 나오면 v6 등으로 올려 유입을 분리한다).
            // utm_content = scan_id — 앱이 InstallAttribution.kt에서 읽어 되돌려준다.
            var PLAY = 'https://play.google.com/store/apps/details?id=com.wowtap.app'
                     + '&referrer=utm_source%3Dpackage_qr%26utm_medium%3Dprint%26utm_campaign%3Dpackage_v5'
                     + '%26utm_content%3D' + scanId;

            var GA_ID = 'G-MYKQYF0CMW';   // GA4 웹 스트림 (Firebase 프로젝트 wowtap-e8fc6 의 속성)
            var WAIT_MS = 1000;           // 아래 "이동 지연" 설명 참조
            var SEEN_KEY = 'wowtap_qr_redirected';

            var ua = navigator.userAgent || '';
            // iPadOS 13+ 는 UA가 Macintosh로 잡히므로 터치 지원 여부로 함께 판별한다.
            var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            var isAndroid = /Android/.test(ua);
            var device = isIOS ? 'ios' : (isAndroid ? 'android' : 'other');
            var target = isIOS ? APPSTORE : (isAndroid ? PLAY : null);   // null = PC 등, 이동하지 않음

            window.__wowtap = { device: device, appstore: APPSTORE, play: PLAY };

            // ── 재실행 방지 ──
            // 🔴 왜 필요한가: 스토어 앱으로 넘어갈 때 웹 이동은 "취소"되므로 이 문서가 탭에 그대로 남는다.
            //    iOS Safari는 탭을 닫지 않으므로, 메모리 부족으로 탭이 폐기됐다가 사용자가 다시 열면
            //    페이지가 재로드되어 ① qr_landing 이 중복 전송되고 ② 스토어로 또 튕겨 나간다.
            //    sessionStorage는 같은 탭 안에서 재로드를 넘어 유지되므로 이 플래그로 한 번만 처리한다.
            //    (QR을 다시 찍으면 새 탭 = 새 세션이라 정상적으로 다시 집계된다.)
            var already = false;
            try { already = sessionStorage.getItem(SEEN_KEY) === '1'; } catch (e) {}

            // ── GA4 로드 ──
            window.dataLayer = window.dataLayer || [];
            function gtag() { dataLayer.push(arguments); }
            window.gtag = gtag;
            gtag('js', new Date());
            gtag('config', GA_ID);

            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
            document.head.appendChild(s);

            // 이미 처리된 세션이면 집계도 이동도 하지 않는다 — 버튼만 있는 페이지로 남긴다.
            if (already) return;

            // ── 도착 이벤트 전송 후 이동 ──
            // 🔴 이동을 지연시키는 이유: gtag.js는 외부 서버에서 로드되므로,
            //    로드되기 전에 페이지를 떠나면 이벤트가 **하나도 기록되지 않는다**.
            //    전송이 끝나면 콜백으로 즉시 이동하고, 늦어지면 WAIT_MS 후 그냥 이동한다
            //    (수집보다 사용자를 스토어로 보내는 것이 우선).
            function go() {
                try { sessionStorage.setItem(SEEN_KEY, '1'); } catch (e) {}
                location.replace(target);
            }
            var moved = false;
            function once() { if (!moved) { moved = true; go(); } }

            gtag('event', 'qr_landing', {
                device_type: device,
                store: isIOS ? 'app_store' : (isAndroid ? 'google_play' : 'none'),
                scan_id: scanId,   // 앱의 install_attributed 이벤트와 같은 값으로 짝을 맞춘다
                event_callback: target ? once : undefined
            });
            if (target) setTimeout(once, WAIT_MS);
        })();
    </script>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 48px 20px 64px;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
            line-height: 1.7;
            color: #222;
            background: #fff;
            -webkit-text-size-adjust: 100%;
        }
        .wrap { max-width: 420px; margin: 0 auto; text-align: center; }
        .brand {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #2680EB;
            margin-bottom: 28px;
        }
        h1 { font-size: 1.25rem; margin: 0 0 8px; }
        .lead { color: #555; margin: 0 0 32px; font-size: 0.95rem; }
        .lead .en { color: #999; font-size: 0.85rem; }

        /* ── 스토어 버튼 ──
           바탕을 채워 "누를 수 있는 것"으로 읽히게 한다(테두리만으로는 안 읽혔다).
           연한 그레이 계열 — 흰 배경 위에서 한 단계 낮은 면으로 떠 보이게 한다.
           흰 바탕+테두리만 있던 최초 버전과 달리, 채움·테두리·그림자·위쪽 흰 하이라이트를
           함께 줘서 "눌리는 면"으로 읽히게 했다.
           색은 R=G=B 인 중립 그레이 — 파랑기가 섞인 슬레이트 계열은 브랜드 컬러와
           미묘하게 부딪혀 "약간 푸르다"고 읽혔다. */
        .btn {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            min-height: 94px;
            padding: 18px 22px;
            margin: 16px 0;
            border: 1px solid #D2D2D2;
            border-radius: 18px;
            background: linear-gradient(180deg, #F2F2F2 0%, #E2E2E2 100%);
            text-decoration: none;
            color: #1A1A1A;
            text-align: left;
            box-shadow: 0 1px 1px rgba(16, 24, 40, 0.04), 0 6px 16px rgba(16, 24, 40, 0.06), inset 0 1px 0 #fff;
            transition: transform .08s ease, background .15s ease, box-shadow .15s ease;
        }
        .btn:active {
            transform: scale(.98);
            background: linear-gradient(180deg, #E6E6E6 0%, #D6D6D6 100%);
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }
        .btn svg { display: block; pointer-events: none; }   /* 클릭 대상은 항상 <a> */

        /* 로고는 고정 폭 슬롯 안에 넣는다 — 글리프 가로폭이 서로 달라도
           두 버튼의 구분선·글자 시작점이 정확히 같은 자리에 오게 하기 위함. */
        .marks { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
        .slot { display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .slot-brand { width: 32px; }
        .slot-store { width: 54px; }

        /* viewBox를 글리프에 딱 맞춰 잘라야 두 로고가 같은 크기로 보인다.
           (이전엔 로봇이 viewBox의 33%만 채워, 같은 32px 박스에서 Apple 27.6px 대 로봇 10.4px로 그려졌다)
           Apple은 세로로 긴 글리프(0.86), 로봇은 가로로 넓은 글리프(1.56)라 높이를 같게 하면
           로봇이 과하게 커진다. 그래서 가로·세로의 기하평균이 비슷해지도록 맞췄다. */
        .mk-apple   { width: 24px; height: 28px; }           /* 실제 24.0 × 27.8 */
        .mk-android { width: 30px; height: 20px; }           /* 실제 30.0 × 19.2 */
        .mk-store   { width: 54px; height: 54px; }           /* App Store 아이콘 (정사각) */
        .mk-play    { width: 50px; height: 54px; }           /* Play 로고는 세로가 더 길다 (68:74) */
        .sep { width: 1px; height: 42px; background: #CBCBCB; flex: 0 0 auto; }

        .label { display: flex; flex-direction: column; justify-content: center; line-height: 1.25; }
        .l1 { font-size: 1.32rem; font-weight: 700; letter-spacing: -0.01em; color: #1A1A1A; }
        .l2 { font-size: 0.86rem; color: #6E6E6E; margin-top: 4px; }

        .hint { color: #888; font-size: 0.85rem; margin-top: 24px; }
        footer { margin-top: 44px; color: #aaa; font-size: 0.8rem; }
        footer a { color: #888; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="brand">wowtap!</div>

    <h1>앱 다운로드</h1>
    <p class="lead">
        사용 중인 기기의 스토어로 이동합니다.<br>
        <span class="en">Get the app for your device</span>
    </p>

    <!-- 자동 이동이 실패해도 다운로드가 가능하도록 두 스토어를 항상 노출한다.
         href는 JS 없이도 동작하는 기본 주소이고, 스크립트가 살아 있으면 추적 파라미터가 붙은
         주소로 아래에서 덮어쓴다 (주소의 단일 출처는 <head>의 APPSTORE / PLAY 상수). -->
    <a class="btn" data-store="app_store" href="https://apps.apple.com/app/apple-store/id6795469163">
        <span class="marks">
          <span class="slot slot-brand">
            <!-- Apple 로고 (형태 그대로 · viewBox만 글리프 경계로 조임: x3.18~21.08 / y0.99~21.72) -->
            <svg class="mk-apple" viewBox="3.18 0.99 17.90 20.73" fill="#1D1D1F" aria-hidden="true">
                <path d="M16.37 1.43c0 1.14-.42 2.2-1.25 3.03-1 1-2.19 1.58-3.29 1.49-.02-.14-.03-.28-.03-.42 0-1.1.47-2.24 1.3-3.05.42-.42.95-.77 1.57-1.05.62-.27 1.21-.42 1.77-.44 0 .15.01.29.01.44z"/>
                <path d="M20.75 17.02c-.32.74-.7 1.42-1.14 2.05-.6.86-1.09 1.45-1.47 1.78-.59.54-1.22.82-1.9.84-.49 0-1.07-.14-1.76-.42-.69-.28-1.32-.42-1.9-.42-.6 0-1.25.14-1.95.42-.7.28-1.26.43-1.69.45-.65.03-1.3-.26-1.94-.86-.41-.36-.92-.98-1.53-1.85-.65-.93-1.19-2-1.61-3.23-.45-1.32-.68-2.6-.68-3.84 0-1.42.31-2.64.92-3.67.48-.82 1.12-1.47 1.92-1.94.8-.48 1.67-.73 2.6-.74.52 0 1.19.16 2.03.48.83.32 1.37.48 1.6.48.18 0 .78-.19 1.79-.56.96-.35 1.77-.49 2.43-.44 1.8.15 3.15.86 4.05 2.14-1.61.98-2.4 2.34-2.39 4.09.02 1.36.51 2.5 1.48 3.4.44.42.93.74 1.47.97-.12.34-.24.66-.38.97z"/>
            </svg>
          </span>
            <span class="sep"></span>
          <span class="slot slot-store">
            <!-- App Store 앱 아이콘 — 참고 이미지 픽셀 실측 (2026-08-12-001, 2차 정정)
                 viewBox 78 = 실측 아이콘 한 변(px). 아이콘 중심 x=38.5.
                 모서리 R17.9 — 위에서 8행째 들여쓰기 3px, 12행째 1px 을 원의 방정식에 넣어 역산.
                 그라디언트 양 끝은 좌측 세로선 6~94% 샘플을 0%/100%로 외삽한 값.
                 'A' = 삼각형을 이루는 막대 3개 (사선 2 + 가로 1), 굵기 6.8 · 라운드 캡.
                 3차 정정: 더 선명한 참고 이미지로 기하·모서리·α 를 전부 재적합했다.
                   · 모서리 R17.9 → 18.7 (아이콘 윤곽 전체를 원호/초타원 양쪽으로 피팅한 결과
                     원호 R18.7 이 RMS 0.486px 로 초타원(0.624)보다 정확했다 — 원호가 맞다)
                   · 픽셀당 4×4 슈퍼샘플로 안티에일리어싱까지 흉내 내 폭 편향을 제거하고 재최적화
                   · 검증(전체 픽셀 색상): 평균 14.72→12.49, 90분위 41.06→35.01

                 🔴 막대는 불투명 흰색이 아니라 **반투명이고, 막대마다 길이 방향 투명도 그라디언트**가 있다.
                    겹치는 곳이 밝게 뜨고 투명도가 자리마다 달라서, 세 막대가 서로 엉켜
                    삼각형을 이루는 것처럼 보인다. 불투명 단색으로 그리면 한 덩어리로 뭉친다.
                    실측(단일 막대만 덮는 픽셀을 길이 t 에 대해 선형회귀, 잔차 σ≈0.05):
                      좌사선 α 0.47→0.91 · 우사선 0.61→0.65 · 가로바 0.70→0.52
                    폭 방향 음영도 재봤으나(좌사선 +0.17·가로바 +0.20) 넣어도 오차가
                    줄지 않아(10.01 vs 9.99) 길이 방향만 유지한다 — 관측된 폭 방향 차이는
                    대부분 막대 경계의 안티에일리어싱이 섞여 들어온 것이다.
                    막대 색은 순백 유지 — 역산하면 #F7FFFF 가 나오지만 R 차이 8(3%)로
                    썸네일 리샘플링 오차 범위이고 눈에 보이지 않는다.
                    ⚠️ 투명도는 각 path 의 stroke 에 그라디언트로 준다. g 의 opacity 로 주면
                       셋이 먼저 합쳐진 뒤 한 번에 투명해져 겹침이 사라진다. -->
            <svg class="mk-store" viewBox="0 0 78 78" aria-hidden="true">
                <defs>
                    <!-- 막대에서 떨어진 '순수 바탕' 3500px 을 세로 위치에 대해 최소제곱 피팅한 값 -->
                    <linearGradient id="asGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#5ABAF5"/>
                        <stop offset="1" stop-color="#2E5CE6"/>
                    </linearGradient>
                    <!-- 좌표를 막대 양끝에 그대로 맞춰야 하므로 userSpaceOnUse -->
                    <linearGradient id="asBarL" gradientUnits="userSpaceOnUse" x1="19" y1="59" x2="43" y2="17.5">
                        <stop offset="0" stop-color="#fff" stop-opacity="0.47"/>
                        <stop offset="1" stop-color="#fff" stop-opacity="0.91"/>
                    </linearGradient>
                    <linearGradient id="asBarR" gradientUnits="userSpaceOnUse" x1="58" y1="59" x2="34" y2="17.5">
                        <stop offset="0" stop-color="#fff" stop-opacity="0.61"/>
                        <stop offset="1" stop-color="#fff" stop-opacity="0.65"/>
                    </linearGradient>
                    <linearGradient id="asBarH" gradientUnits="userSpaceOnUse" x1="14.5" y1="48.25" x2="62.5" y2="48.25">
                        <stop offset="0" stop-color="#fff" stop-opacity="0.70"/>
                        <stop offset="1" stop-color="#fff" stop-opacity="0.52"/>
                    </linearGradient>
                </defs>
                <rect width="78" height="78" rx="18.7" fill="url(#asGrad)"/>
                <g fill="none" stroke-width="6.8" stroke-linecap="round">
                    <path d="M19 59 43 17.5"     stroke="url(#asBarL)"/>
                    <path d="M58 59 34 17.5"     stroke="url(#asBarR)"/>
                    <path d="M14.5 48.25h48"     stroke="url(#asBarH)"/>
                </g>
            </svg>
          </span>
        </span>
        <span class="label">
            <span class="l1">App Store</span>

        </span>
    </a>

    <a class="btn" data-store="google_play" href="https://play.google.com/store/apps/details?id=com.wowtap.app">
        <span class="marks">
          <span class="slot slot-brand">
            <!-- Android 로봇 (형태 그대로 · viewBox만 글리프 경계로 조임: x11.8~36.2 / y6.4~22.0)
                 Google Play는 삼성 전용이 아니라 모든 안드로이드 기기의 스토어이므로 삼성 로고를 쓰지 않는다. -->
            <svg class="mk-android" viewBox="11.8 6.4 24.4 15.6" aria-hidden="true">
                <path d="M12 22a12 12 0 0 1 24 0z" fill="#3DDC84"/>
                <g stroke="#3DDC84" stroke-width="1.8" stroke-linecap="round">
                    <path d="M15.4 11.9 12.7 7.3"/>
                    <path d="M32.6 11.9 35.3 7.3"/>
                </g>
                <circle cx="19.4" cy="16.6" r="1.5" fill="#fff"/>
                <circle cx="28.6" cy="16.6" r="1.5" fill="#fff"/>
            </svg>
          </span>
            <span class="sep"></span>
          <span class="slot slot-store">
            <!-- Google Play 로고 — 참고 이미지 픽셀 실측 (2026-08-12-001)
                 viewBox 68×74 = 실측 로고 크기(px).
                 구조: 점 P(31.5,36.5)에서 교차하는 45° 직선 2개가 4색을 가른다
                   L1  x = y − 5   (파랑↔초록 · 빨강↔노랑)
                   L2  x = 68 − y  (파랑↔빨강 · 초록↔노랑)
                 4색 조각은 경계 밖까지 넉넉히 그리고 아래 둥근 삼각형으로 잘라낸다.
                 색은 Google 브랜드 팔레트 — 썸네일 실측값은 안티에일리어싱으로 일괄 옅어져 있었다. -->
            <svg class="mk-play" viewBox="0 0 68 74" aria-hidden="true">
                <defs>
                    <clipPath id="playClip">
                        <!-- 좌상·좌하 R6.5 / 오른쪽 꼭짓점 R7.7 로 둥글린 삼각형 -->
                        <path d="M1 6.61 L1 66.39
                                 A6.5 6.5 0 0 0 10.66 72.07
                                 L62.58 43.23
                                 A7.7 7.7 0 0 0 62.58 29.77
                                 L10.66 0.93
                                 A6.5 6.5 0 0 0 1 6.61 Z"/>

                <g clip-path="url(#playClip)">
                    <path d="M31.5 36.5 -10 -5 -10 78z"   fill="#4285F4"/>
                    <path d="M31.5 36.5 -10 -5 73 -5z"    fill="#34A853"/>

                    <path d="M31.5 36.5 -10 78 73 78z"    fill="#EA4335"/>

</div>
<script>
    (function () {
        var w = window.__wowtap || {};

        // 버튼 href를 추적 파라미터가 붙은 주소로 교체한다.
        // (HTML의 href는 스크립트가 죽었을 때를 위한 기본 주소 — 이동은 되고 집계만 안 된다)
        var ios = document.querySelector('a[data-store="app_store"]');
        var and = document.querySelector('a[data-store="google_play"]');
        if (ios && w.appstore) { ios.href = w.appstore; }
        if (and && w.play) { and.href = w.play; }

        // 수동 버튼 클릭 기록 — 자동 이동이 빗나간 경우가 얼마나 되는지 파악하는 지표다.
        // 이동을 막지 않는다. gtag는 sendBeacon으로 보내므로 페이지를 떠나도 전송된다.
        document.addEventListener('click', function (e) {
            var a = e.target.closest ? e.target.closest('a[data-store]') : null;
            if (a && window.gtag) {
                window.gtag('event', 'store_click', {
                    store: a.getAttribute('data-store'),
                    device_type: w.device || 'unknown'
                });
            }
        });
    })();
</script>
